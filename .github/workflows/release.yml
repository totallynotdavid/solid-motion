name: release

# Pushing a tag vX.Y.Z publishes that version to npm. The tag must match
# package.json. npm trusts this workflow through OIDC (`npm trust github`), so
# no token is stored in the repository.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Tag matches package.json
        run: |
          version=$(bun -e 'console.log(require("./package.json").version)')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME != package.json $version"
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - run: bun run check

  publish:
    name: Publish to npm
    needs: check
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'totallynotdavid' }}

    environment:
      name: npm
      url: https://www.npmjs.com/package/@totallynotdavid/solid-motion

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile

      # prepack builds dist. Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - run: npm publish --access public

  github:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
