name: release

# Pushing a tag vX.Y.Z publishes that version to npm. The tag must match
# package.json. npm trusts this workflow through OIDC (`npm trust github`), so
# no token is stored in the repository.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5

      - run: mise run release:tag

      - run: mise run install

      - run: mise run check

  publish:
    name: Publish to npm
    needs: check
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'totallynotdavid' }}

    environment:
      name: npm
      url: https://www.npmjs.com/package/@totallynotdavid/solid-motion

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5

      - run: mise run install

      # prepack builds dist. Trusted publishing needs npm 11.5.1 or later.
      # The Node version pinned in mise.toml includes it.
      - run: mise run publish

  github:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
