name: release

# Pushing a tag vX.Y.Z publishes that version to npm. The tag must match
# package.json. npm trusts this workflow through OIDC (`npm trust github`), so
# no token is stored in the repository.

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - run: bun run release:tag

      - run: bun install --frozen-lockfile

      - run: bun run check

      # Packing avoids npm publish rejecting an already published version.
      # It runs prepack and lists the files that publish would upload.
      - run: npm pack --dry-run

  publish:
    name: Publish to npm
    needs: check
    runs-on: ubuntu-latest
    if:
      ${{ github.repository_owner == 'totallynotdavid' && startsWith(github.ref,
      'refs/tags/') }}

    environment:
      name: npm
      url: https://www.npmjs.com/package/@totallynotdavid/solid-motion

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - run: bun install --frozen-lockfile

      # prepack builds dist. Trusted publishing needs npm 11.5.1 or later.
      # The Node version pinned in mise.toml includes it.
      - run: bun run release:publish

  github:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: .github/release-notes.md
          generate_release_notes: true
